#
# Cross-build NXVK (NVK + Zink for the Nintendo Switch) inside the toolchain image
# from switch/docker, the same way `make image && make && make gl` does locally.
#
# Output: nxvk-portlib, an installed-style tree to extract over $DEVKITPRO
# (portlibs/switch/...). It is uploaded as a run artifact, and also published as a
# release when the workflow is run by hand with a version.
name: Switch

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Leave it empty to avoid publishing a release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: nxvk:ci
  # The scripts hardcode /work, so the checkout must be mounted there.
  # GIT_CONFIG_*: the container runs as root over a runner-owned checkout.
  DOCKER_ARGS: >-
    --rm -i
    -v ${{ github.workspace }}:/work
    -w /work
    -e GIT_CONFIG_COUNT=1
    -e GIT_CONFIG_KEY_0=safe.directory
    -e GIT_CONFIG_VALUE_0=/work
  # The Makefile runs ninja through `bash -lc`, and Debian's /etc/profile resets PATH
  # for root, dropping the image's cargo/rustc. Put it back alongside the native tools.
  NINJA_ENV: >-
    cp -r switch/docker/cross-include/. /opt/switch-cross-include/ 2>/dev/null || true;
    export PATH="/work/switch/build/native-tools/bin:/opt/rust/cargo/bin:$$PATH";

jobs:
  build:
    name: Build (Vulkan + OpenGL)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write   # only used by the release steps

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        env:
          # No build record: neither the .dockerbuild artifact nor the job summary.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: switch/docker
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=nxvk-toolchain
          cache-to: type=gha,scope=nxvk-toolchain,mode=max

      - name: Build Vulkan driver (make)
        run: |
          docker run $DOCKER_ARGS -e NINJA_ENV "$IMAGE" bash -euo pipefail -s <<'EOF'
          make CONTAINER= "NINJA_ENV=$NINJA_ENV"
          EOF

      - name: Build OpenGL stack (make gl)
        run: |
          docker run $DOCKER_ARGS -e NINJA_ENV "$IMAGE" bash -euo pipefail -s <<'EOF'
          make gl CONTAINER= "NINJA_ENV=$NINJA_ENV"
          EOF

      - name: Stage portlib
        run: |
          docker run $DOCKER_ARGS "$IMAGE" bash -euo pipefail -s <<'EOF'
          make install-gl CONTAINER= DEVKITPRO=/work/dist
          ls -lR dist
          EOF

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Upload portlib
        uses: actions/upload-artifact@v4
        with:
          name: nxvk-portlib
          path: dist/
          if-no-files-found: error

      - name: Package release asset
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: (cd dist && zip -qr "../nxvk-portlib-v${{ inputs.version }}.zip" .)

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "nxvk v${{ inputs.version }}"
          files: nxvk-portlib-v${{ inputs.version }}.zip
          draft: false
          prerelease: false
